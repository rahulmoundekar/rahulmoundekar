<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f1f46"/>
      <stop offset="100%" stop-color="#25114f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="900" height="560" rx="30" fill="url(#bg)"/>
  <circle cx="130" cy="100" r="85" fill="#38bdf8" opacity=".08"/>
  <circle cx="760" cy="450" r="100" fill="#a855f7" opacity=".10"/>

  <!-- Laptop -->
  <g filter="url(#shadow)">
    <rect x="165" y="70" width="570" height="320" rx="20" fill="url(#screen)" stroke="#475569" stroke-width="3"/>
    <rect x="190" y="98" width="520" height="262" rx="12" fill="#050b18" stroke="#1e293b"/>

    <circle cx="210" cy="118" r="5" fill="#f87171"/>
    <circle cx="228" cy="118" r="5" fill="#facc15"/>
    <circle cx="246" cy="118" r="5" fill="#4ade80"/>

    <g font-family="Consolas,Monaco,monospace" font-size="16">
      <text x="220" y="154" fill="#38bdf8">class RahulArchitecture {</text>
      <text x="244" y="187" fill="#c4b5fd">Security</text><text x="322" y="187" fill="#e2e8f0"> → JWT + RBAC</text>
      <text x="244" y="218" fill="#86efac">Reliability</text><text x="340" y="218" fill="#e2e8f0"> → Idempotency</text>
      <text x="244" y="249" fill="#fbbf24">Events</text><text x="300" y="249" fill="#e2e8f0"> → Kafka + Outbox</text>
      <text x="244" y="280" fill="#f9a8d4">Integration</text><text x="340" y="280" fill="#e2e8f0"> → Webhooks</text>
      <text x="244" y="311" fill="#7dd3fc">Data</text><text x="286" y="311" fill="#e2e8f0"> → PostgreSQL + Redis</text>
      <text x="220" y="344" fill="#38bdf8">}</text>
    </g>
  </g>

  <!-- Base -->
  <path d="M110 412 Q450 370 790 412 L725 452 L175 452 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="330" y="420" width="240" height="10" rx="5" fill="#64748b" opacity=".5"/>

  <!-- Floating labels -->
  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
    <rect x="70" y="150" width="128" height="40" rx="20" fill="#1d4ed8"/><text x="101" y="176" fill="#fff">Spring Boot</text>
    <rect x="700" y="125" width="130" height="40" rx="20" fill="#7c3aed"/><text x="735" y="151" fill="#fff">Microservices</text>
    <rect x="78" y="326" width="110" height="40" rx="20" fill="#0f766e"/><text x="106" y="352" fill="#fff">PostgreSQL</text>
    <rect x="714" y="320" width="84" height="40" rx="20" fill="#047857"/><text x="737" y="346" fill="#fff">Kafka</text>
  </g>

  <text x="450" y="505" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Designing for correctness first, scale second.</text>
</svg>