<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="title desc">
<title id="title">Rahul Moundekar technology stack</title>
<desc id="desc">Animated technology stack grouped into backend, frontend, data, messaging and platform, with AI workflow tooling.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="1" stop-color="#172554"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:Arial,Helvetica,sans-serif}
    .pulse{animation:glow 6.5s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.72}50%{opacity:1}}
  </style>
</defs>
<rect width="1280" height="480" rx="28" fill="url(#bg)"/><rect x="18" y="18" width="1244" height="444" rx="24" fill="url(#grid)"/>

<g>
