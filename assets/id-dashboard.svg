  <g class="chip">
    <text class="mono" x="1012" y="315" fill="#22d3ee" font-size="9.5" font-weight="700" letter-spacing="1.5">CORRECTNESS</text>
    <text class="sans" x="1012" y="336" fill="#eceef6" font-size="13">Idempotency + concurrency</text>
    <text class="mono" x="1012" y="374" fill="#a78bfa" font-size="9.5" font-weight="700" letter-spacing="1.5">SECURITY</text>
    <text class="sans" x="1012" y="395" fill="#eceef6" font-size="13">JWT + RBAC + tenant RLS</text>
    <text class="mono" x="1012" y="433" fill="#22c55e" font-size="9.5" font-weight="700" letter-spacing="1.5">RESILIENCE</text>
    <text class="sans" x="1012" y="454" fill="#eceef6" font-size="13">Retries + DLT + recovery</text>
    <text class="mono" x="1012" y="492" fill="#f59e0b" font-size="9.5" font-weight="700" letter-spacing="1.5">EXPLORING</text>
