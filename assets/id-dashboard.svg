<g font-family="Arial" font-size="14"><text x="76" y="263" fill="#64748b">FOCUS</text><text x="178" y="263" fill="#e2e8f0">Security · Reliability · System Design</text><text x="76" y="299" fill="#64748b">STACK</text><text x="178" y="299" fill="#e2e8f0">Java · Spring · PostgreSQL · Kafka</text><text x="76" y="335" fill="#64748b">BUILDING</text><text x="178" y="335" fill="#e2e8f0">Production-style backend systems</text><text x="76" y="371" fill="#64748b">EXPLORING</text><text x="178" y="371" fill="#e2e8f0">Spring AI · MCP · RAG · Agents</text></g>
