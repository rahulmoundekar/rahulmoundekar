<rect x="34" y="108" width="380" height="102" rx="18" fill="#0f172a" stroke="#22d3ee"/><text x="58" y="141" fill="#67e8f9" font-size="13" font-weight="700">01 · CORRECTNESS</text><text x="58" y="174" fill="#f8fafc" font-size="19" font-weight="700">Idempotency + concurrency</text><text x="58" y="196" fill="#94a3b8" font-size="12">Payments · transaction invariants</text>
<rect x="438" y="108" width="380" height="102" rx="18" fill="#0f172a" stroke="#a78bfa"/><text x="462" y="141" fill="#c4b5fd" font-size="13" font-weight="700">02 · SECURITY</text><text x="462" y="174" fill="#f8fafc" font-size="19" font-weight="700">Identity + tenant isolation</text><text x="462" y="196" fill="#94a3b8" font-size="12">JWT · RBAC · PostgreSQL RLS</text>
<rect x="34" y="230" width="380" height="102" rx="18" fill="#0f172a" stroke="#22c55e"/><text x="58" y="263" fill="#86efac" font-size="13" font-weight="700">03 · RESILIENCE</text><text x="58" y="296" fill="#f8fafc" font-size="19" font-weight="700">Recoverable failure paths</text><text x="58" y="318" fill="#94a3b8" font-size="12">Retries · DLT · replay · outbox</text>
