    <rect x="600" y="142" width="198" height="92" rx="18" fill="#0b1220" stroke="#a78bfa" stroke-opacity=".32"/>
    <rect x="810" y="142" width="198" height="92" rx="18" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".32"/>
    <rect x="1020" y="142" width="198" height="92" rx="18" fill="#0b1220" stroke="#22c55e" stroke-opacity=".32"/>
  </g>
  <g class="sans" text-anchor="middle">
    <text x="489" y="188" fill="#eceef6" font-size="34" font-weight="800">06</text><text class="mono" x="489" y="210" fill="#8d93ab" font-size="10" letter-spacing="1.6">PUBLIC FLAGSHIPS</text>
    <text x="699" y="188" fill="#eceef6" font-size="34" font-weight="800">06</text><text class="mono" x="699" y="210" fill="#8d93ab" font-size="10" letter-spacing="1.6">ARCHITECTURE VIEWS</text>
    <text x="909" y="188" fill="#eceef6" font-size="34" font-weight="800">04</text><text class="mono" x="909" y="210" fill="#8d93ab" font-size="10" letter-spacing="1.6">CI-ENABLED REPOS</text>
    <text x="1119" y="188" fill="#eceef6" font-size="34" font-weight="800">02</text><text class="mono" x="1119" y="210" fill="#8d93ab" font-size="10" letter-spacing="1.6">PRIVATE PRODUCTS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="252" width="578" height="292" rx="20" fill="#090f1c" stroke="#334155"/>
    <rect x="986" y="252" width="232" height="292" rx="20" fill="#090f1c" stroke="#334155"/>
  </g>
  <text class="mono" x="420" y="282" fill="#8d93ab" font-size="10.5" letter-spacing="1.6">FLAGSHIP ENGINEERING WORK</text>
  <g class="sans">
    <rect x="420" y="300" width="518" height="37" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="442" cy="318.5" r="5" fill="#22d3ee"/><text x="458" y="323" fill="#eceef6" font-size="12.5" font-weight="700">Payment Idempotent Ledger</text><text x="916" y="323" fill="#64748b" font-size="10" text-anchor="end">CORRECTNESS</text>
    <rect x="420" y="345" width="518" height="37" rx="10" fill="#0f172a" stroke="#1e293b"/>
