  <text class="sans" x="390" y="94" fill="#eceef6" font-size="29" font-weight="700">Profile at a glance</text>
  <text class="mono" x="390" y="119" fill="#64748b" font-size="11">REAL SYSTEMS · REAL TRADE-OFFS · RECOVERABLE FAILURE</text>

