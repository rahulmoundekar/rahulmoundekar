<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="title desc">
<title id="title">Rahul Moundekar developer ID and engineering dashboard</title>
<desc id="desc">A cinematic developer ID card with an engineering dashboard showing portfolio scale, flagship projects, architecture themes and current focus.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#24104f"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:Arial,Helvetica,sans-serif}
    .label{font-size:10.5px;letter-spacing:2px;font-weight:700}
    .chip{animation:pulse 7s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.72}45%{opacity:1}}
  </style>
</defs>
<rect width="1280" height="600" rx="28" fill="url(#bg)"/>
<rect x="18" y="18" width="1244" height="564" rx="24" fill="url(#grid)"/>
<circle cx="1135" cy="80" r="150" fill="#7c3aed" opacity=".09"/>
<circle cx="1170" cy="465" r="180" fill="#22d3ee" opacity=".045"/>

<g filter="url(#shadow)" transform="rotate(-3 190 345)">
  <path d="M76 150V66C76 44 92 28 114 28h152c22 0 38 16 38 38v84" fill="none" stroke="#475569" stroke-width="5"/>
  <path d="M131 72h118" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <rect x="54" y="150" width="272" height="378" rx="24" fill="#07101d" stroke="#334155"/>
  <rect x="75" y="173" width="230" height="4" rx="2" fill="url(#accent)"/>
  <text class="mono" x="77" y="201" fill="#22d3ee" font-size="10.5" letter-spacing="2">DEVELOPER ID</text>
  <text class="mono" x="302" y="201" fill="#8d93ab" font-size="10" text-anchor="end">RM-2026</text>
  <circle cx="190" cy="278" r="63" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="190" cy="278" r="48" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 8"/>
  <text class="sans" x="190" y="289" fill="#f8fafc" font-size="36" font-weight="800" text-anchor="middle">RM</text>
  <text class="sans" x="190" y="380" fill="#eceef6" font-size="23" font-weight="700" text-anchor="middle">Rahul Moundekar</text>
  <text class="mono" x="190" y="403" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1.6">SENIOR JAVA FULL STACK DEVELOPER</text>
  <line x1="77" y1="430" x2="303" y2="430" stroke="#334155"/>
  <text class="mono" x="77" y="458" fill="#8d93ab" font-size="9.5" letter-spacing="1.5">FOCUS</text>
  <text class="sans" x="77" y="477" fill="#eceef6" font-size="12.5">Security · Reliability · System Design</text>
  <text class="mono" x="77" y="501" fill="#8d93ab" font-size="9.5" letter-spacing="1.5">BUILDING</text>
  <text class="sans" x="77" y="520" fill="#eceef6" font-size="12.5">Production-style backend systems</text>
  <text class="mono" x="290" y="564" fill="#64748b" font-size="9.5" text-anchor="end">@rahulmoundekar</text>
</g>

<g>
