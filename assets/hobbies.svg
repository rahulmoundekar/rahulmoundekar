<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="110" cy="70" r="80" fill="#38bdf8" opacity=".10"/>
  <circle cx="1090" cy="250" r="110" fill="#a855f7" opacity=".12"/>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="35" y="30" width="350" height="270" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".18"/>
  </g>
  <circle cx="92" cy="92" r="30" fill="#38bdf8" opacity=".18"/>
  <path d="M71 82c18-8 35-1 43 12M72 107c14-10 29-5 40 4" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round"/>
  <path d="M103 76l22 11-10 4" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="156" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Badminton</text>
  <text x="70" y="195" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Fast rallies • focus • movement</text>
  <text x="70" y="231" fill="#93c5fd" font-family="Segoe UI,Arial,sans-serif" font-size="14">A good reset away from the keyboard.</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="425" y="30" width="350" height="270" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".18"/>
  </g>
  <circle cx="482" cy="92" r="30" fill="#a78bfa" opacity=".18"/>
  <rect x="458" y="72" width="48" height="35" rx="7" fill="none" stroke="#ede9fe" stroke-width="4"/>
  <path d="M470 119h24M476 107v12M488 107v12M468 101l-7 7M496 101l7 7" stroke="#ede9fe" stroke-width="4" stroke-linecap="round"/>
  <text x="460" y="156" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Video Games</text>
  <text x="460" y="195" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Strategy • challenge • immersion</text>
  <text x="460" y="231" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="14">Another way to explore systems and problem solving.</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="815" y="30" width="350" height="270" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".18"/>
  </g>
  <circle cx="872" cy="92" r="30" fill="#22c55e" opacity=".18"/>
  <path d="M850 105l12-24 13 11 15-18" fill="none" stroke="#dcfce7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="850" cy="105" r="4" fill="#dcfce7"/>
  <circle cx="862" cy="81" r="4" fill="#dcfce7"/>
  <circle cx="875" cy="92" r="4" fill="#dcfce7"/>
  <circle cx="890" cy="74" r="4" fill="#dcfce7"/>
  <text x="850" y="156" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Engineering Lab</text>
  <text x="850" y="195" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Side projects • architecture • experiments</text>
  <text x="850" y="231" fill="#86efac" font-family="Segoe UI,Arial,sans-serif" font-size="14">Building small systems to learn big ideas.</text>
</svg>
